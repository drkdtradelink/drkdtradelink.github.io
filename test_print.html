<!DOCTYPE html>
<html>
<head>
<style>
@media print {
    @page { margin: 0; size: auto; }
    body { margin: 0; }
    .portrait {
        width: 210mm;
        height: 297mm;
        page-break-after: always;
        background: red;
    }
    .landscape {
        width: 297mm;
        height: 210mm;
        page-break-after: always;
        background: blue;
        /* Hack to print landscape in portrait mode */
        transform: rotate(-90deg) translateY(-297mm);
        transform-origin: top left;
    }
}
</style>
</head>
<body>
    <div class="portrait">Portrait Page</div>
    <div class="landscape">Landscape Page</div>
</body>
</html>
